    :root {
      --bg: #07070a;
      --amber: #f5a623;
      --hi: #e6ddc0;
      --ink-dim: #64625c;
      --body: 'Courier Prime', 'Courier New', monospace;

      --glass-border: rgba(245,166,35,0.25);
    }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--body);
    }

    canvas {
      display: block;
      position: relative;
      z-index: 2;
    }

    #supporters-title {
      position: fixed;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--display);
      font-size: clamp(28px, 5vw, 64px);
      font-weight: 400;
      color: var(--amber);

      letter-spacing: 0.02em;
      z-index: 10;
      white-space: nowrap;
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      backdrop-filter: blur(4px);
      background: rgba(0,0,0,0.25);
      opacity: 0;
      transition: 0.25s;
      pointer-events: none;
      z-index: 1;
    }
    .overlay.active { opacity: 1; }

    .search {
      position: fixed;
      top: 65%;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);

      font-family: var(--body);

      z-index: 3;
      background: rgba(13,13,18,0.9);
      color: var(--hi);

.uiverse {

const hearts = followers.map(f => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  vx: (Math.random() - 0.5) * 2,
  vy: (Math.random() - 0.5) * 2,
  r: HEART_SIZE,
  name: f.name,
  time: f.time,
  stopped: false,
  opacity: 1
}));

let mouse = {x: 0, y: 0};
let hovered = null;

canvas.onmousemove = e => { mouse.x = e.clientX; mouse.y = e.clientY; };

function drawHeart(x, y, size, alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(x - size/2, y - size/2, x - size, y + size/2, x, y + size);
  ctx.bezierCurveTo(x + size, y + size/2, x + size/2, y - size/2, x, y);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function rectCollision(h, rect) {
  const cx = Math.max(rect.left, Math.min(h.x, rect.right));
  const cy = Math.max(rect.top, Math.min(h.y, rect.bottom));
  const dx = h.x - cx, dy = h.y - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  
  if (dist < h.r) {
    const overlap = h.r - dist;
    const nx = dx / (dist || 1), ny = dy / (dist || 1);
    h.x += nx * overlap; h.y += ny * overlap;
    h.vx += nx * 1.5;    h.vy += ny * 1.5;
    
  }
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hovered = null;

const sr = search.getBoundingClientRect();
const br = document.getElementById("go-back").getBoundingClientRect();
const tr = document.getElementById("supporters-title").getBoundingClientRect();

const collisionRects = [
  sr,
  br,
  tr
];

  const sx = sr.left + sr.width / 2;
  const sy = sr.top  + sr.height / 2;
  const query = search.value.toLowerCase();

  hearts.forEach((h, i) => {
    const dxm = h.x - mouse.x, dym = h.y - mouse.y;
    if (Math.sqrt(dxm*dxm + dym*dym) < h.r) hovered = h;

    if (!h.stopped) {
      h.x += h.vx; h.y += h.vy;
      if (h.x < 0 || h.x > canvas.width)  h.vx *= -1.2;
      if (h.y < 0 || h.y > canvas.height) h.vy *= -1.2;

      if (query && h.name.includes(query)) {
        h.vx += (sx - h.x) * 0.001;
        h.vy += (sy - h.y) * 0.001;
        h.opacity = 1;
      } else if (query) {
        h.opacity = 0.1;
      } else {
        h.opacity = 1;
      }

    collisionRects.forEach(rect => rectCollision(h, rect));

      hearts.forEach((o, j) => {
        if (i === j) return;
        const dx = h.x - o.x, dy = h.y - o.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < h.r * 2) { h.vx += dx * 0.01; h.vy += dy * 0.01; }
      });

      h.vx *= 0.99; h.vy *= 0.99;
    }

    drawHeart(h.x, h.y, h.r, h.opacity);
  });

  if (hovered) {
    hovered.stopped = true;

    const cw = 200, ch = 48;
    let cx = hovered.x + 18;
    let cy = hovered.y - 8;
    if (cx + cw > window.innerWidth  - 8) cx = hovered.x - cw - 18;
    if (cy + ch > window.innerHeight - 8) cy = window.innerHeight - ch - 8;
    if (cy < 8) cy = 8;

    card.style.left = cx + "px";
    card.style.top  = cy + "px";
    cardName.textContent = hovered.name;
    cardTime.textContent = hovered.time;
    card.style.transform = "scale(1)";
    overlay.classList.add("active");
    drawHeart(hovered.x, hovered.y, hovered.r * 1.3, 1);
  } else {
    hearts.forEach(h => h.stopped = false);
    card.style.transform = "scale(0)";
    overlay.classList.remove("active");
  }

  requestAnimationFrame(update);
}

update();
</script>
